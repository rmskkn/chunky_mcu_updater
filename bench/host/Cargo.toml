# The power-cut bench harness (HW-4): its own workspace, so the main one stays free of probe-rs and the glitcher.
[workspace]
resolver = "3"
members = ["chunky_bench", "chunky_bench_cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
repository = "https://github.com/romixlab/chunky_mcu_updater"

[workspace.dependencies]
chunky_bench = { path = "chunky_bench" }
bench_layout = { path = "../bench_layout" }
embassy_torn = { path = "../../embassy_torn" }
anyhow = "1"
csv = "1"
# CMSIS-DAP v2 (bulk, nusb) only: Donguru has no HID (v1) interface, so no hidapi.
probe-rs = { version = "0.32", default-features = false, features = ["builtin-targets"] }
# The Xyloni glitcher (fpga_tools release 0.7.0, GLT-8 push-pull od_out).
glitch = { git = "ssh://git@github.com/vhrdtech/fpga_tools.git", rev = "4e55b51" }
embassy-boot = "=0.7.0"
embedded-storage = "0.3.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
anstream = "1"
anstyle = "1"
indicatif = "0.18"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3
