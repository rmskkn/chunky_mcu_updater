name: poc tests

on:
  push:
    paths: &code
      - 'lib/**'
      - 'middleware/**'
      - 'platform/**'
      - 'device/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'rust/**'
      - 'SPEC.md'
      - 'Makefile'
      - '.github/workflows/poc-tests.yml'
  pull_request:
    paths: *code

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install liblz4
        run: sudo apt-get update && sudo apt-get install -y liblz4-dev

      - name: build (default geometry)
        run: make

      - name: compress unit tests (ASan/UBSan)
        run: make test-compress

      - name: end-to-end tests, all geometries
        run: tests/run_matrix.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C reader against the golden vectors, and the example
        run: make vectors example

      - name: Rust tests, generated header current
        run: make rust-test check-regen
