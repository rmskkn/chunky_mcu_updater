[package]
name = "chunky_server"
description = "chunky host side: image builder and signer, content-addressed blob store, delta planner"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
chunky = { workspace = true, features = ["ed25519", "unsigned"] }
chunky_format.workspace = true
sha2 = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["std"] }
getrandom = "0.3"
