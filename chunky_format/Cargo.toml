[package]
name = "chunky_format"
description = "The chunky wire format as shrink_wrap types with a fixed little-endian layout, and a constant-offset reader for minimal bootloaders (no_std)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Local checkout next to this repository (~/git/wire_weaver), as in the other repos that use it.
shrink_wrap = { path = "../../wire_weaver/shrink_wrap/shrink_wrap", default-features = false }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
sha2.workspace = true
chunky = { workspace = true, features = ["ed25519", "unsigned"] }
chunky_server.workspace = true
